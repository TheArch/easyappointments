# Interner Servername (Intranet-Link, Lesezeichen, alte Mail-Links) auf die
# oeffentliche HTTPS-Adresse umleiten. Sonst baut EasyAppointments die
# Aenderungs-/Stornolinks in den Kundenmails mit http://srvimpfkal...
server {
    listen 80;
    server_name srvimpfkal.srv.med.uni-muenchen.de;
    return 302 https://impfung-baed-neu.med.uni-muenchen.de$request_uri;
}

server {
    listen 80 default;

    server_name localhost;

    client_max_body_size 128M;

    access_log /var/log/nginx/application.access.log;

    root /var/www/html;
    
    index index.php index.html;
    
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
        
    location ~ ^.+.php {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+?.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_index index.php;
        include fastcgi_params;
    }
    
    location ~ /\.ht {
        deny all;
    }
}
